name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Version pins in step, no secret literals
        run: deploy/ci/check-deploy.sh
      - name: Build and test
        run: ./gradlew build
      - uses: actions/upload-artifact@v7
        with:
          name: bigbook-server-jar
          path: server/build/libs/bigbook-server.jar
          retention-days: 1

  # Issue #2 acceptance: fresh Ubuntu 24.04 VM, cold image cache, three healthy containers in under 10 minutes.
  lite-boot:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Not published yet, so the image comes from a registry on the runner and is pulled like any other.
      # Only the repository is overridden; the tag is lite.yml's own default, BIGBOOK_VERSION from versions.env.
      BIGBOOK_IMAGE: localhost:5000/bigbook-server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: bigbook-server-jar
          path: server/build/libs
      - name: Build the server image and park it in a local registry
        run: |
          set -a; . deploy/versions.env; set +a
          docker run -d --name registry -p 5000:5000 registry:3.1.1
          docker build --build-arg TEMURIN_VERSION="$TEMURIN_VERSION" -t "$BIGBOOK_IMAGE:$BIGBOOK_VERSION" server
          docker push "$BIGBOOK_IMAGE:$BIGBOOK_VERSION"
      - name: Empty the image cache
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -v '^registry:' | xargs -r docker rmi -f
          docker builder prune -af
          docker images
      - name: Boot lite on a cold cache, timed
        run: deploy/ci/lite-boot.sh
      - name: Logs
        if: failure()
        run: docker compose -f deploy/compose/lite.yml logs --tail 200
